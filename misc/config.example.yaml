log_level: info
socket: /var/run/systemd-supervisord.socket
discovery_interval: 30s

units:
  # Static unit - single health check
  nginx.service:
    enabled: true
    health_checks:
      - type: http
        interval: 10s
        timeout: 5s
        retries: 3
        http:
          address: http://localhost:80
    restart:
      enabled: true
      backoff: 5s
      cooldown: 60s

  # Static unit - multiple health check endpoints
  # Unit is healthy only when ALL endpoints pass
  salt-master.service:
    enabled: true
    health_checks:
      - type: tcp
        interval: 10s
        timeout: 5s
        retries: 3
        tcp:
          address: localhost:4505
      - type: tcp
        interval: 10s
        timeout: 5s
        retries: 3
        tcp:
          address: localhost:4506
    restart:
      enabled: true
      backoff: 10s
      cooldown: 120s

  # Individual template instances
  # Each instance is a separate unit in systemd
  myapp@shard0.service:
    enabled: true
    health_checks:
      - type: tcp
        interval: 15s
        timeout: 5s
        retries: 3
        tcp:
          address: localhost:8080
    restart:
      enabled: true
      backoff: 5s
      cooldown: 60s

  myapp@shard1.service:
    enabled: true
    health_checks:
      - type: tcp
        interval: 15s
        timeout: 5s
        retries: 3
        tcp:
          address: localhost:8081
    restart:
      enabled: true
      backoff: 5s
      cooldown: 60s

  # Template unit with auto-discovery
  # Names ending with @ before the suffix are auto-discovered
  # Finds all running worker@*.service instances automatically
  # New instances are picked up every discovery_interval
  worker@.service:
    health_checks:
      - type: http
        interval: 10s
        timeout: 5s
        retries: 3
        http:
          address: "http://localhost:{{instance}}/health"
    restart:
      enabled: true
      backoff: 10s
      cooldown: 120s

  # Template with instance pattern filter
  # Only discovers instances matching the regex inside {}
  # e.g. runtime@app-web1.service matches, runtime@db-main.service does not
  "runtime@{app-[a-z]+[0-9]+}.service": {}

  # Unit with script-based health check
  # Script must exit 0 for healthy, non-zero for unhealthy
  mydb.service:
    enabled: true
    health_checks:
      - type: script
        interval: 15s
        timeout: 10s
        retries: 3
        script:
          command: "pg_isready -h localhost -p 5432"
    restart:
      enabled: true
      backoff: 10s
      cooldown: 120s

  # Unit with grace period - health checks start after 30s
  # Useful for services with slow startup
  elasticsearch.service:
    enabled: true
    grace_period: 30s
    depends_on:
      - mydb
    health_checks:
      - type: http
        interval: 15s
        timeout: 10s
        retries: 3
        http:
          address: http://localhost:9200/_cluster/health
          method: GET
          expected_status: 200
          response_match: "\"status\":\"green\""
          headers:
            Authorization: "Basic ZWxhc3RpYzpjaGFuZ2VtZQ=="
    restart:
      enabled: true
      backoff: 15s
      cooldown: 180s

  # Timer unit with execution monitoring
  # Restart if the timer has not triggered within max_delay
  certbot-renew.timer:
    enabled: true
    max_delay: 48h

  salt-minion-state-highstate.timer:
    enabled: true
    max_delay: 1h

notify:
  # Custom variables included in all notifications
  # Webhooks: added as "variables" JSON object
  # Scripts/execs: added as SUPERVISORD_VAR_<KEY> env vars (keys uppercased)
  variables:
    hostname: web-01
    environment: production
  webhooks:
    - url: http://alerting.example.com/webhook
      timeout: 10s
  scripts:
    - path: /usr/local/bin/notify-on-failure.sh
      timeout: 30s
  # Exec actions - run shell commands on events
  execs:
    - command: "logger -t supervisord 'Unit $SUPERVISORD_UNIT_NAME state: $SUPERVISORD_ACTIVE_STATE'"
      timeout: 10s
    - command: "/usr/local/bin/restart-hook.sh"
      timeout: 30s
      events:
        - state_changed
